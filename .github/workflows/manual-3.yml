name: Cron Test

on:
  push:
    branches:
      - main

  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test
        run: |
          echo "================================"
          echo "WORKFLOW TRIGGERED"
          echo "Event: ${{ github.event_name }}"
          echo "UTC:   $(date -u)"
          echo "================================"
